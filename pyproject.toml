[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "duolingo-vocab-export"
version = "0.1.0"
description = "Export your Duolingo vocabulary (with audio) to CSV/JSON and build Anki decks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "genanki>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
duolingo-export = "duolingo_export.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
